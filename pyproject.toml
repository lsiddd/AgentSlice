[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentslice"
dynamic = ["version"]
description = "A causal context compiler for tool-using agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "lsiddd" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/lsiddd/AgentSlice"
Repository = "https://github.com/lsiddd/AgentSlice"
Changelog = "https://github.com/lsiddd/AgentSlice/blob/main/CHANGELOG.md"

[project.scripts]
agentslice = "agentslice.cli:app"

[tool.hatch.version]
path = "src/agentslice/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentslice"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "benchmarks"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src/agentslice"]
